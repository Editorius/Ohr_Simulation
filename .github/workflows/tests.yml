name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      # No external dependencies, lockfile or build step in this project.
      - name: Run regression tests
        run: npm test

  reproduce:
    name: Reproduce model and export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Reproduce arrays, references and stability
        run: python scripts/reproduce.py --stability
      - name: Check release packaging
        run: python scripts/test_export.py
